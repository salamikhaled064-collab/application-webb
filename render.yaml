# Render Blueprint – version simplifiée : 2 services + 1 base PostgreSQL.
#  - ai-video-api : l'API ET le worker de génération dans le même processus
#  - ai-video-web : le site (Next.js) ; il relaie /api/* vers l'API (aucun CORS, aucun cookie tiers)
# Redis et le stockage S3/R2 sont OPTIONNELS (voir DEPLOY.md).

services:
  - type: web
    name: ai-video-api
    runtime: node
    plan: starter
    # --include=dev : indispensable, NODE_ENV=production ferait sauter TypeScript au build
    buildCommand: npm install --include=dev && npx prisma generate && npm run build:api
    startCommand: npx prisma migrate deploy && npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-video-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: VIDEO_PROVIDER
        value: mock # passez à "agnes" quand une clé est ajoutée dans /admin
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: STORAGE_PROVIDER
        value: local
      # Compte administrateur créé / mis à jour automatiquement au démarrage.
      # Renseignez-les au premier déploiement, puis SUPPRIMEZ le mot de passe.
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false

  - type: web
    name: ai-video-web
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build:web
    startCommand: npm run start:web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Adresse INTERNE de l'API (réseau privé Render), lue au démarrage : aucun rebuild nécessaire.
      - key: API_URL
        fromService:
          type: web
          name: ai-video-api
          property: hostport

databases:
  - name: ai-video-db
    plan: starter
    databaseName: aivideo
    user: aivideo
