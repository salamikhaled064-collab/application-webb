version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aivideo
      POSTGRES_PASSWORD: aivideo_password
      POSTGRES_DB: aivideo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivideo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://aivideo:aivideo_password@postgres:5432/aivideo
      REDIS_URL: redis://redis:6379
      WEB_URL: http://localhost:3000
      SESSION_SECRET: docker-dev-session-secret-must-be-32chars
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      VIDEO_PROVIDER: mock
      STORAGE_DIR: /var/data/storage
      RUN_WORKER_IN_API: "false"
    volumes:
      - storage_data:/var/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: npm run start:worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://aivideo:aivideo_password@postgres:5432/aivideo
      REDIS_URL: redis://redis:6379
      VIDEO_PROVIDER: mock
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      STORAGE_DIR: /var/data/storage
    volumes:
      - storage_data:/var/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  storage_data:
