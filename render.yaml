# Render Blueprint – requires shared object storage (R2/S3) for API + Worker
# See DEPLOY.md for GitHub + Render step-by-step

services:
  - type: web
    name: ai-video-web
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build:web
    startCommand: npm run start:web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: web
    name: ai-video-api
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build:api
    startCommand: npx prisma migrate deploy && npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-video-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-video-redis
          property: connectionString
      - key: WEB_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: VIDEO_PROVIDER
        value: mock
      - key: RUN_WORKER_IN_API
        value: "false"
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: ai-video-worker
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build:api
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-video-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-video-redis
          property: connectionString
      - key: VIDEO_PROVIDER
        value: mock
      - key: ENCRYPTION_KEY
        sync: false
      - key: RUN_WORKER_IN_API
        value: "false"
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: keyvalue
    name: ai-video-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: ai-video-db
    plan: starter
    databaseName: aivideo
    user: aivideo
